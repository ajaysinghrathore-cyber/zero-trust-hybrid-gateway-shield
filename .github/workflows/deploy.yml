name: Infrastructure CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  audit-and-scan:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Validate Security Configuration
      run: |
        echo "[INFO] Checking declared container and runtime security controls..."
        test -f Dockerfile
        test -f kubernetes/pod.yaml
        test -f terraform/main.tf

    - name: Run Trivy Filesystem Scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        format: table
        exit-code: '1'
        ignore-unfixed: true
        severity: CRITICAL,HIGH

    - name: Security Validation Summary
      run: |
        echo "[SUCCESS] Repository checks and Trivy scan completed successfully."
